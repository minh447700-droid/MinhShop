<!DOCTYPE html>
<html lang="vi">
<!-- Thẻ gốc, ngôn ngữ tiếng Việt -->

<head>
  <!-- Chứa cấu hình trang web -->

  <meta charset="UTF-8">
  <!-- Hiển thị tiếng Việt không lỗi font -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Co giãn vừa vặn màn hình điện thoại -->

  <title>Thanh Toán - MinhShop</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Nhúng thư viện Bootstrap 5 -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Nhúng thư viện icon FontAwesome -->

  <style>
    /* CSS tùy chỉnh */
    body {
      background-color: #0f1217; /* Nền đen/tối sang trọng */
      color: #e0e6ed;            /* Chữ xám sáng */
    }
    .text-gold {
      color: #ffd700 !important; /* Chữ màu vàng kim */
    }
    .btn-gold {
      background-color: #d4af37; /* Nút màu vàng */
      color: #000;                /* Chữ đen */
      font-weight: bold;          /* Chữ in đậm */
      border: none;               /* Xóa viền nút */
    }
    .btn-gold:hover {
      background-color: #ffdf00; /* Đổi màu khi di chuột vào nút */
      color: #000;
    }
    .content-box {
      background-color: #16222f; /* Nền khung nội dung màu xanh biển tối */
      border: 1px solid #1d3557; /* Viền mỏng xanh */
    }
    .form-control-dark {
      background-color: #0f1217; /* Ô nhập liệu nền tối */
      color: #ffffff;             /* Chữ nhập vào màu trắng */
      border: 1px solid #2a3d54;  /* Viền xám xanh */
    }
    .form-control-dark:focus {
      background-color: #0f1217;
      color: #ffffff;
      border-color: #d4af37;     /* Viền sáng vàng khi click chọn */
      box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25); /* Đổ bóng vàng */
    }
    .social-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;        /* Bo tròn tuyệt đối thành hình tròn */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s ease; /* Chuyển động mượt */
    }
    .social-avatar:hover {
      transform: scale(1.15);    /* Phóng to 15% khi di chuột vào */
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- 
    body: Thẻ chứa toàn bộ nội dung
    d-flex: Bật Flexbox
    flex-column: Xếp các khối theo chiều dọc
    min-vh-100: Đẩy Footer luôn nằm dính đáy màn hình
  -->

  <!-- HEADER (ĐẦU TRANG) -->
  <div class="p-3 bg-dark text-center border-bottom border-warning shadow-sm">
    <!-- 
      div: Khối chứa
      p-3: Lề trong mức 3
      bg-dark: Nền màu tối
      text-center: Căn giữa chữ
      border-bottom: Viền ở cạnh dưới
      border-warning: Viền màu vàng
      shadow-sm: Đổ bóng nhẹ
    -->
    <h1 class="m-0 fw-bold text-gold">MinhShop</h1>
    <!-- 
      h1: Tiêu đề lớn nhất
      m-0: Bỏ lề ngoài
      fw-bold: Chữ in đậm
      text-gold: Chữ màu vàng kim
    -->
  </div>

  <!-- NỘI DUNG CHÍNH -->
  <div class="container my-5 flex-grow-1">
    <!-- 
      container: Gom gọn nội dung vào giữa
      my-5: Lề trên/dưới mức 5
      flex-grow-1: Tự giãn độ cao chiếm khoảng trống
    -->
    <h2 class="text-center text-gold fw-bold mb-4">Thông Tin Thanh Toán</h2>
    <!-- 
      h2: Tiêu đề cấp 2
      mb-4: Lề dưới mức 4
    -->

    <form action="index.html" method="GET">
      <!-- 
        form: Biểu mẫu chứa các ô nhập dữ liệu
        action="index.html": Chuyển về trang chủ sau khi bấm gửi
        method="GET": Phương thức gửi dữ liệu qua URL
      -->
      <div class="row g-4">
        <!-- 
          row: Hàng trong hệ thống lưới Bootstrap
          g-4: Khoảng cách giữa các cột mức 4
        -->

        <!-- CỘT TRÁI: FORM ĐIỀN THÔNG TIN -->
        <div class="col-md-6">
          <!-- col-md-6: Chia đôi màn hình (chiếm 50% độ rộng) -->
          <div class="p-4 content-box rounded-4 shadow-lg border border-warning opacity-75 h-100">
            <!-- 
              p-4: Lề trong mức 4
              content-box: Nền xanh đen tùy chỉnh
              rounded-4: Bo tròn 4 góc
              shadow-lg: Đổ bóng đậm
              border border-warning: Viền màu vàng
              opacity-75: Độ mờ 75%
              h-100: Chiều cao 100% bằng cột bên
            -->
            <h4 class="text-gold fw-bold mb-3">1. Địa chỉ nhận hàng</h4>
            <!-- h4: Tiêu đề cấp 4 -->
            
            <div class="mb-3">
              <!-- mb-3: Lề dưới mức 3 -->
              <label class="form-label text-gold small fw-bold">Họ và tên người nhận:</label>
              <!-- 
                label: Nhãn tên ô nhập
                form-label: Định dạng nhãn chuẩn
                small: Chữ cỡ nhỏ
              -->
              <input type="text" class="form-control form-control-dark" placeholder="Nhập họ và tên" required>
              <!-- 
                input: Ô nhập dòng ngắn
                type="text": Định dạng văn bản
                form-control: Kiểu ô nhập chuẩn Bootstrap
                placeholder: Chữ gợi ý mờ
                required: Bắt buộc phải nhập mới cho gửi
              -->
            </div>

            <div class="row">
              <!-- Hàng con chia nhỏ cột -->
              <div class="col-md-6 mb-3">
                <label class="form-label text-gold small fw-bold">Số điện thoại:</label>
                <input type="tel" class="form-control form-control-dark" placeholder="Nhập số điện thoại" required>
                <!-- type="tel": Định dạng nhập số điện thoại -->
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-gold small fw-bold">Email:</label>
                <input type="email" class="form-control form-control-dark" placeholder="Nhập email">
                <!-- type="email": Định dạng nhập địa chỉ email -->
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label text-gold small fw-bold">Địa chỉ giao hàng:</label>
              <input type="text" class="form-control form-control-dark" placeholder="Số nhà, tên đường, phường/xã..." required>
            </div>

            <div class="mb-3">
              <label class="form-label text-gold small fw-bold">Ghi chú đơn hàng:</label>
              <textarea class="form-control form-control-dark" rows="2" placeholder="Ghi chú thêm về thời gian giao hàng..."></textarea>
              <!-- 
                textarea: Ô nhập văn bản nhiều dòng
                rows="2": Chiều cao bằng 2 dòng văn bản
              -->
            </div>

            <h4 class="text-gold fw-bold my-3">2. Phương thức thanh toán</h4>
            <!-- my-3: Lề trên và dưới mức 3 -->

            <div class="mb-2">
              <div class="form-check">
                <!-- form-check: Khung chứa nút chọn radio/checkbox -->
                <input class="form-check-input" type="radio" name="payment" id="cod" checked>
                <!-- 
                  type="radio": Nút chọn 1 trong nhiều
                  name="payment": Gom nhóm các lựa chọn
                  checked: Mặc định được chọn sẵn
                -->
                <label class="form-check-label text-light" for="cod">
                  <!-- for="cod": Bấm vào chữ cũng kích hoạt nút có id="cod" -->
                  Thanh toán khi nhận hàng (COD)
                </label>
              </div>
            </div>

            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="payment" id="bank">
                <label class="form-check-label text-light" for="bank">
                  Chuyển khoản ngân hàng (QR Code)
                </label>
              </div>
            </div>

            <button type="submit" class="btn btn-gold w-100 fw-bold py-2 fs-5 my-3">XÁC NHẬN ĐẶT HÀNG</button>
            <!-- 
              button: Nút bấm
              type="submit": Nút gửi form
              w-100: Độ rộng tràn 100%
              py-2: Lề trong trên/dưới mức 2
              fs-5: Cỡ chữ mức 5
            -->

            <div class="text-center">
              <a href="index.html" class="btn btn-outline-info btn-sm px-3">Quay lại trang chủ</a>
              <!-- 
                a: Thẻ liên kết
                btn-outline-info: Nút viền xanh thông tin
                btn-sm: Cỡ nút nhỏ
                px-3: Lề trong trái/phải mức 3
              -->
            </div>
          </div>
        </div>

        <!-- CỘT PHẢI: MAP & AVATAR MẠNG XÃ HỘI NẰM DƯỚI MAP -->
        <div class="col-md-6">
          <div class="p-4 content-box rounded-4 shadow-lg border border-warning opacity-75 h-100 d-flex flex-column">
            <!-- d-flex flex-column: Bật Flexbox xếp dọc các phần tử bên trong -->
            
            <h4 class="text-gold fw-bold mb-3">Bản đồ khu vực giao hàng</h4>
            
            <div class="flex-grow-1" style="min-height: 280px;">
              <!-- flex-grow-1: Tự mở rộng chiếm hết khoảng trống dọc còn lại -->
              <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.6696086202425!2d106.68006831480063!3d10.762201292330756!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752f1b7c3ed289%3A0xa06648f9a50a10c2!2zTmd1eeG7gW4gVHLDo2ksIFE1LCBUaMOgbmggcGjhu5EgSOG7kyBDaMOtIE1pbmgsIFZp4buHdCBOYW0!5e0!3m2!1svi!2s!4v1650000000000!5m2!1svi!2s" 
                width="100%" 
                height="100%" 
                style="border:0; min-height: 280px;" 
                class="rounded-3 shadow-sm"
                allowfullscreen="" 
                loading="lazy">
              </iframe>
              <!-- 
                iframe: Thẻ nhúng bản đồ Google Maps
                allowfullscreen="": Cho phép mở toàn màn hình
                loading="lazy": Tải chậm bản đồ để tăng tốc độ trang web
              -->
            </div>

            <!-- AVATAR MẠNG XÃ HỘI DẠNG HÌNH TRÒN -->
            <div class="text-center mt-4 pt-3 border-top border-secondary">
              <!-- 
                pt-3: Lề trong phía trên mức 3
                border-top: Viền ở cạnh trên
                border-secondary: Viền màu xám
              -->
              <div class="d-flex justify-content-center gap-3">
                <!-- 
                  justify-content-center: Căn giữa các icon
                  gap-3: Khoảng cách giữa các icon mức 3
                -->
                <a href="https://www.twitter.com" target="_blank" class="btn btn-outline-warning social-avatar rounded-circle">
                  <!-- 
                    target="_blank": Mở liên kết ở tab mới
                    rounded-circle: Bo tròn thành hình tròn
                  -->
                  <i class="fab fa-twitter"></i>
                  <!-- i: Thẻ chứa icon Twitter -->
                </a>

                <a href="https://www.facebook.com" target="_blank" class="btn btn-outline-warning social-avatar rounded-circle">
                  <i class="fab fa-facebook-f"></i>
                  <!-- i: Icon Facebook -->
                </a>

                <a href="https://www.instagram.com" target="_blank" class="btn btn-outline-warning social-avatar rounded-circle">
                  <i class="fab fa-instagram"></i>
                  <!-- i: Icon Instagram -->
                </a>

                <a href="https://www.gmail.com" target="_blank" class="btn btn-outline-warning social-avatar rounded-circle">
                  <i class="fas fa-envelope"></i>
                  <!-- i: Icon Email/Hòm thư -->
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- FOOTER (CHÂN TRANG) -->
  <footer class="p-3 bg-dark text-center mt-auto border-top border-warning">
    <!-- 
      footer: Thẻ chân trang
      mt-auto: Tự đẩy footer xuống đáy màn hình
    -->
    <p class="m-0 text-gold font-monospace">©MinhShop</p>
    <!-- font-monospace: Font chữ kiểu máy tính -->
  </footer>

</body>
</html>
